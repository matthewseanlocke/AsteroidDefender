<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroid Defender</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </head>
  <body>
    <div id="scoreDisplay">
      <div id="currentScore"><span id="currentScoreValue">0</span></div>
    </div>
    <div id="storedPowerUps"></div>
    <div id="countdownContainer">
      <div id="countdownScrim"></div>
      <div id="countdownDisplay">3</div>
    </div>
    <div id="overlay">
      <div id="logo"></div>
      <div id="gameOverText" style="display: none">GAME OVER</div>
      <div id="highScore"><i class="fas fa-crown"></i> <span id="highScoreValue">-</span></div>
      <div id="startText">INSERT COIN</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
